<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Pop Idol Survival Simulator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>K-Pop Idol Survival Simulator</h1>
    <p>Hosted by Won Young (IVE) & Cha Eun Woo (ASTRO)</p>
  </header>

  <section id="intro">
    <p>Choose your trainee type:</p>
    <button onclick="startGame('Korean')">Korean Trainee</button>
    <button onclick="customForeign()">Foreign Trainee</button>
  </section>

  <section id="game" class="hidden">
    <div id="status">
      <p id="playerStats"></p>
      <p id="episodeInfo"></p>
      <p id="ranking"></p>
    </div>
    <div id="scenario">
      <p id="scenarioText"></p>
      <div id="options"></div>
      <p id="timer">10</p>
    </div>
    <button id="nextBtn" class="hidden" onclick="nextScenario()">Next</button>
  </section>

  <section id="endScreen" class="hidden">
    <h2 id="endMessage"></h2>
    <button onclick="restartGame()">Restart</button>
  </section>
</div>
<script src="script.js"></script>
</body>
</html>
