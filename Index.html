<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Pop Idol Survival Simulator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>K-Pop Idol Survival Simulator</h1>
    <div id="narration"></div>
    <div id="game">
        <button id="startBtn">Start Game</button>
    </div>
    <div id="stats" class="hidden">
        <h2>Your Trainee Stats</h2>
        <p>Singing: <span id="singing"></span></p>
        <p>Dancing: <span id="dancing"></span></p>
        <p>Rapping: <span id="rapping"></span></p>
        <p>Visual: <span id="visual"></span></p>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
